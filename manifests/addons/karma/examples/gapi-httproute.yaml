# Example: exposes Karma through a Gateway API gateway.
# Copy this file into your own source and replace every `changeme`. Do not
# reference this directory from a kustomization. It is an example, not a
# component.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karma
spec:
  parentRefs:
    - name: changeme
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: changeme
      sectionName: changeme
  hostnames:
    - changeme
  rules:
    - name: karma
      backendRefs:
        - name: karma
          group: ""
          kind: Service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
