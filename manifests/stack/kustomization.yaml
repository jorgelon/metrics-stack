resources:
  - alertmanager
  - grafana
  - grafana-operator/v5.22.2
  - kube-state-metrics
  - metrics-server/v0.8.1
  - node-exporter
  - prometheus
  - prometheus-operator/v0.90.0
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
