resources:
  - alertmanager
  - grafana
  - grafana-operator/v5.25.0
  - kube-state-metrics
  - metrics-server/v0.9.0
  - node-exporter
  - prometheus
  - prometheus-operator/v0.90.0
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
  # The operator gives every config-reloader sidecar a 10m CPU limit. The value
  # 0 removes the limit, so a reload burst is not throttled. The Prometheus and
  # the Alertmanager instances set the CPU request of their own sidecar.
  - target:
      kind: Deployment
      name: prometheus-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --config-reloader-cpu-limit=0
