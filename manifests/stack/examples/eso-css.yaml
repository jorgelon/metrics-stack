# Example ClusterSecretStore for Azure Key Vault, shared by the whole stack.
# Copy it into your own source and list the copy under `resources:`.
#
# This is the only file in the release that declares the store named
# `akv-metrics-stack`. Two examples read from it by name:
# stack/grafana/examples/eso-es-grafana-env-akv.yaml and
# stack/alertmanager/examples/eso-es-msteams-webhook-url-azurekv.yaml. Copy
# this file once and share it.
#
# It authenticates as a service principal, reading its credentials from the
# `akv-eso-creds` secret in the `external-secrets` namespace. That secret ships
# with the External Secrets Operator release.
#
# Replace the two sentinels: `tenantId` and the host part of `vaultUrl`.
#
# This file is cluster-scoped, so it carries no namespace. Do not set
# `namespace:` in the kustomization that lists it. Kustomize does not know that
# a custom resource is cluster-scoped, so it writes a namespace into it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: akv-metrics-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: metrics-stack
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      environmentType: PublicCloud
      # Service principal credentials, from the external-secrets release
      authSecretRef:
        clientId:
          key: clientId
          name: akv-eso-creds
          namespace: external-secrets
        clientSecret:
          key: clientSecret
          name: akv-eso-creds
          namespace: external-secrets
      tenantId: changeme
      vaultUrl: https://changeme.vault.azure.net
  conditions:
    - namespaces:
        - monitoring
