# Azure AD single sign-on for Grafana, through the External Secrets Operator.
#
# A plain kustomization, because it patches nothing. It goes in the consumer's
# `resources:`.
#
# Deliberately NO `namespace:` here. eso-css.yaml is a ClusterSecretStore, and
# kustomize does not know that a custom resource is cluster-scoped, so the
# namespace transformer would write a namespace into it. eso-es-grafana-env.yaml
# carries `namespace: monitoring` in its own metadata instead.
resources:
  - eso-css.yaml
  - eso-es-grafana-env.yaml
labels:
  - pairs:
      app.kubernetes.io/name: grafana
