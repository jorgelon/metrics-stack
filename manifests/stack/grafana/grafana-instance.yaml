apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-k8s
spec:
  config:
    auth:
      disable_login_form: "false"
    log:
      mode: console
  deployment:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "grafana-env"
        reloader.stakater.com/rollout-strategy: "restart"
    spec:
      # Storage is not declared here. Copy examples/k8s-pvc-grafana.yaml and
      # examples/grafana-instance.yaml into your own source for a volume-backed
      # instance. Grafana keeps its state in SQLite on that volume unless you
      # point it at an external database.
      template:
        spec:
          containers:
            - envFrom:
                - secretRef:
                    name: grafana-env
                    optional: true
              name: grafana
              resources:
                requests:
                  cpu: 100m
                limits:
                  memory: 512Mi
          securityContext:
            fsGroup: 472
            supplementalGroups:
              - 0
