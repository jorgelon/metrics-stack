apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-k8s
spec:
  config:
    auth:
      disable_login_form: "false"
    log:
      mode: console
  deployment:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
        reloader.stakater.com/rollout-strategy: "restart"
    spec:
      # A single replica backed by the claim named grafana, which the release
      # does not create. Copy examples/k8s-pvc-grafana.yaml to create it.
      #
      # The volume is ReadWriteOnce, so a rolling update deadlocks: the new pod
      # cannot mount the volume while the old one still holds it. Recreate
      # avoids that, at the cost of a short outage on every update.
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            # Both sources are optional. The Secret comes last, so a key in
            # both takes the value of the Secret.
            - envFrom:
                - configMapRef:
                    name: grafana-env
                    optional: true
                - secretRef:
                    name: grafana-env
                    optional: true
              name: grafana
              resources:
                requests:
                  cpu: 100m
                limits:
                  memory: 512Mi
              volumeMounts:
                - mountPath: /var/lib/grafana
                  name: grafana
          securityContext:
            fsGroup: 472
            supplementalGroups:
              - 0
          volumes:
            - name: grafana
              persistentVolumeClaim:
                claimName: grafana
  # The tag comes from the `images:` field of kustomization.yaml, which holds
  # the version. Without a value here, the Grafana Operator writes its own
  # default into this field once and never changes it again, also after an
  # operator upgrade. The full image reference lets `images:` match the field.
  version: docker.io/grafana/grafana
