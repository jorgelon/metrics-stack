# Mounts the claim at the Grafana data directory, where SQLite lives.
# The volume is ReadWriteOnce and Grafana OSS runs one replica, so a rolling
# update deadlocks: the new pod cannot mount the volume while the old one still
# holds it. Recreate avoids that, at the cost of a short outage on every update.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-k8s
spec:
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              volumeMounts:
                - mountPath: /var/lib/grafana
                  name: grafana
          volumes:
            - name: grafana
              persistentVolumeClaim:
                claimName: grafana
