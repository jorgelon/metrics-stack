# Example ExternalSecret that builds the grafana-env secret, which the Grafana
# instance of the parent directory already loads with envFrom. It turns on Azure
# AD single sign-on. Copy it into your own source, together with eso-css.yaml,
# and list both under `resources:`.
#
# Key Vault names cannot contain an underscore, so each secret is named GF-...
# and the rewrite turns the dashes back into underscores. The template below
# fixes the settings that never change, and fills the rest from the vault.
#
# Without this file Grafana starts with the local login form and the admin
# credentials that the Grafana Operator generates.
#
# The namespace ships here, because the kustomization that lists eso-css.yaml
# can set no `namespace:` of its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-env
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  dataFrom:
    - find:
        conversionStrategy: Default
        decodingStrategy: None
        name:
          regexp: ^GF-(.*)$
      rewrite:
        - regexp:
            source: "-"
            target: _
  secretStoreRef:
    kind: ClusterSecretStore
    name: akv-metrics-stack
  target:
    template:
      data:
        GF_AUTH_AZUREAD_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
        GF_AUTH_AZUREAD_ALLOW_SIGN_UP: "true"
        GF_AUTH_AZUREAD_ALLOWED_GROUPS: "{{ .GF_AUTH_AZUREAD_ALLOWED_GROUPS }}"
        GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS: "{{ .GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS }}"
        GF_AUTH_AZUREAD_AUTH_URL: "{{ .GF_AUTH_AZUREAD_AUTH_URL }}"
        GF_AUTH_AZUREAD_AUTO_LOGIN: "false"
        GF_AUTH_AZUREAD_CLIENT_ID: "{{ .GF_AUTH_AZUREAD_CLIENT_ID }}"
        GF_AUTH_AZUREAD_CLIENT_SECRET: "{{ .GF_AUTH_AZUREAD_CLIENT_SECRET }}"
        GF_AUTH_AZUREAD_ENABLED: "true"
        GF_AUTH_AZUREAD_NAME: Azure AD
        GF_AUTH_AZUREAD_ROLE_ATTRIBUTE_STRICT: "true"
        GF_AUTH_AZUREAD_SCOPES: openid email profile
        GF_AUTH_AZUREAD_SKIP_ORG_ROLE_SYNC: "false"
        GF_AUTH_AZUREAD_TOKEN_URL: "{{ .GF_AUTH_AZUREAD_TOKEN_URL }}"
        GF_AUTH_AZUREAD_USE_PKCE: "true"
        GF_DATE_FORMATS_DEFAULT_TIMEZONE: UTC
        GF_SERVER_ROOT_URL: "{{ .GF_SERVER_ROOT_URL }}"
