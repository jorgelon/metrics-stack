# Example claim for the Grafana database. Copy it into your own source together
# with grafana-instance.yaml, list this file under `resources:` and the other
# one under `patches:`.
#
# Grafana OSS keeps users, sessions, annotations and starred dashboards in
# SQLite under /var/lib/grafana. Without this claim every restart loses them.
# Dashboards and datasources survive either way, because the Grafana Operator
# reconciles them from their own objects on every start.
#
# ReadWriteOnce, because Grafana OSS runs a single replica and some storage
# classes do not support ReadWriteMany. 2Gi holds the database and the plugin
# directory on a mid-sized cluster. The storage class is cluster-specific:
# replace `changeme` with a class of your cluster. The sentinel binds nothing,
# so a forgotten replacement leaves the pod Pending instead of landing the
# database on the wrong disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: changeme
