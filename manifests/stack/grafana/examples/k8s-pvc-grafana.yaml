# Example claim for the Grafana database. Copy it into your own source, list
# the copy under `resources:`, and replace `changeme` with a storage class of
# your cluster.
#
# The Grafana instance of the parent directory mounts a claim named `grafana`
# at /var/lib/grafana, where Grafana OSS keeps users, sessions, annotations and
# starred dashboards in SQLite. The release does not create that claim. Without
# this copy the Grafana pod stays Pending.
#
# ReadWriteOnce, because Grafana OSS runs a single replica and some storage
# classes do not support ReadWriteMany. 2Gi holds the database and the plugin
# directory on a mid-sized cluster. The sentinel binds nothing, so a forgotten
# replacement leaves the pod Pending instead of landing the database on the
# wrong disk.
#
# The namespace and the name label ship here, because the consumer copies this
# file into a kustomization that this repository does not control.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: changeme
