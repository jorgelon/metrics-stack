# The MS Teams receiver with its webhook URL read from Azure Key Vault, through
# the ClusterSecretStore that stack/grafana/azure-sso creates. Mutually
# exclusive with msteams-awssm: both pull in ../msteams.
namespace: monitoring
resources:
  - ../msteams
  - eso-es-msteams-webhook-url.yaml
labels:
  - pairs:
      app.kubernetes.io/name: alertmanager
