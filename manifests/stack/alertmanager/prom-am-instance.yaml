apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: k8s-alertmanager
spec:
  alertmanagerConfigSelector:
    matchLabels:
      app.kubernetes.io/part-of: metrics-stack
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: alertmanager
  alertmanagerConfigMatcherStrategy: # disable default matcher strategy
    type: None
  # Storage and container sizes are not declared here. Copy
  # examples/prom-am-instance.yaml into your own source for a 2Gi volume that
  # keeps the notification log and the silences across a restart, with both
  # containers sized.
