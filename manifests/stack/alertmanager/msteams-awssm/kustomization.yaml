# The MS Teams receiver with its webhook URL read from AWS Secrets Manager.
# Mutually exclusive with msteams-azurekv: both pull in ../msteams, so a build
# that lists the two fails on the duplicate AlertmanagerConfig.
namespace: monitoring
resources:
  - ../msteams
  - eso-ss.yaml
  - eso-es-msteams-webhook-url.yaml
labels:
  - pairs:
      app.kubernetes.io/name: alertmanager
