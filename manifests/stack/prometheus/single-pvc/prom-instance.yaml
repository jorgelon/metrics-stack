# One Prometheus replica keeping 7 days on its own volume. This is the simple
# shape: no high availability, no long term storage, no remote write.
#
# 100Gi holds 7 days on the production clusters. A small cluster patches the
# size down. The storage class is cluster-specific: overlay it. `changeme` binds
# nothing, so a missing overlay leaves the pod Pending instead of landing the
# time series on the wrong disk.
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: k8s
spec:
  replicas: 1
  retention: 7d
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
        storageClassName: changeme
