apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: k8s
spec:
  scrapeClasses:
    - name: default-k8s-cluster
      default: true
      relabelings:
        - action: replace
          targetLabel: k8s_cluster # this is the label used by kubernetes-mixin recreated dashboards
          replacement: "local"
  alerting:
    alertmanagers:
      - name: alertmanager-operated
        port: web
        apiVersion: v2
  serviceAccountName: prometheus
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: metrics-stack
  podMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: metrics-stack
  ruleSelector:
    matchLabels:
      app.kubernetes.io/part-of: metrics-stack
  probeSelector:
    matchLabels:
      app.kubernetes.io/part-of: metrics-stack
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  # Replicas, retention and storage are not declared here. Add the single-pvc
  # component for one replica keeping 7 days on its own volume.
  # The prometheus container itself is not sized here either. It tracks the
  # number of series the cluster produces, so it belongs in the consuming
  # overlay.
  # Memory request equals the limit, so the pod lands in the Guaranteed QoS
  # class for memory. No CPU limit, to avoid throttling a bursty reload.
  containers:
    - name: config-reloader
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
        limits:
          memory: 100Mi
