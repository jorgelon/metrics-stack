# Self-contained replacement for manifests/stack/kube-state-metrics/.
#
# It composes the kube-state-metrics base and layers the Gateway API Custom
# Resource State config on top. Include THIS directory in your build *instead
# of* manifests/stack/kube-state-metrics/ — including both would apply the base
# twice.
#
# A kustomization is self-contained, so this directory cannot be included as a
# sibling resource that patches the base: it has to own the base itself.
namespace: monitoring
resources:
  - ../../../stack/kube-state-metrics
  - k8s-cm-gateway-api-state-metrics.yaml
patches:
  # Target selectors take `group` + `version`, NOT `apiVersion` — kustomize
  # rejects the whole build with `unknown field "apiVersion"`.
  - path: k8s-cr-patch-kube-state-metrics.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: kube-state-metrics
  # Strategic merge: merges volumes/volumeMounts by name, so it will not drop
  # volumes the base deployment may gain later.
  - path: k8s-deploy-patch-kube-state-metrics.yaml
  # JSON 6902 append: a strategic merge would replace the whole args list and
  # silently drop the base --metric-labels-allowlist flag.
  - path: k8s-deploy-patch-args-kube-state-metrics.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kube-state-metrics
