namespace: monitoring
resources:
  - grafana-db-coredns-mixin.yaml # mixin
  - grafana-db-coredns.yaml # dotdc
  - prom-rule-coredns.yaml
# The scrape target depends on the platform. Add exactly one of kubeadm/,
# eks-auto-mode/ or ionos/ in the consuming kustomization. kubeadm/ and ionos/
# are plain kustomizations and go in resources:. eks-auto-mode/ patches the
# node-exporter DaemonSet, so it is a component and goes in components:.
labels:
  - pairs:
      app.kubernetes.io/name: coredns
