# Scrape target for IONOS managed Kubernetes: a PodMonitor over the CoreDNS
# pods. A plain kustomization, because it patches nothing, so it goes in the
# consumer's `resources:` next to the parent apps/coredns.
namespace: monitoring
resources:
  - prom-pm-coredns.yaml
labels:
  - pairs:
      app.kubernetes.io/name: coredns
