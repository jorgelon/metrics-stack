apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
spec:
  groups:
    - name: external-secrets-resources
      rules:
        - alert: ExternalSecretNotReady
          annotations:
            summary: ExternalSecret {{ $labels.name }} is not ready
            description: |
              The ExternalSecret `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` is not in Ready state for more than 15 minutes.
              Read the Status field of the ExternalSecret object and the operator logs.
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: critical
            app: external-secrets
        - alert: ClusterExternalSecretNotReady
          annotations:
            summary: ClusterExternalSecret {{ $labels.name }} is not ready
            description: |
              The ClusterExternalSecret `{{ $labels.name }}` is not in Ready state for more than 15 minutes.
              Read the Status field of the ClusterExternalSecret object and the operator logs.
          expr: clusterexternalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: critical
            app: external-secrets
        - alert: PushSecretNotReady
          annotations:
            summary: PushSecret {{ $labels.name }} is not ready
            description: |
              The PushSecret `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` is not in Ready state for more than 15 minutes.
              The operator cannot write the secret value back to the provider.
          expr: pushsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
            app: external-secrets
        - alert: SecretStoreNotReady
          annotations:
            summary: SecretStore {{ $labels.name }} is not ready
            description: |
              The SecretStore `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` is not in Ready state for more than 5 minutes.
              The operator cannot connect to the secret backend. Read the operator logs.
          expr: secretstore_status_condition{condition="Ready", status="False"} == 1
          for: 5m
          labels:
            severity: critical
            app: external-secrets
        - alert: ClusterSecretStoreNotReady
          annotations:
            summary: ClusterSecretStore {{ $labels.name }} is not ready
            description: |
              The ClusterSecretStore `{{ $labels.name }}` is not in Ready state for more than 5 minutes.
              The provider is unreachable, or the authentication failed. Read the operator logs.
          expr: clustersecretstore_status_condition{condition="Ready", status="False"} == 1
          for: 5m
          labels:
            severity: critical
            app: external-secrets
        - alert: ExternalSecretReconcileSlow
          annotations:
            summary: ExternalSecret reconciliation is slow
            description: |
              The ExternalSecret `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` needs more than 10 seconds to reconcile.
              The provider answers slowly, or the operator has too few workers.
          expr: externalsecret_reconcile_duration > 10
          for: 15m
          labels:
            severity: warning
            app: external-secrets
    - name: external-secrets-sync
      rules:
        - alert: ExternalSecretSyncErrorRatioHigh
          annotations:
            summary: More than 10 percent of ExternalSecret sync calls fail
            description: |
              More than 10 percent of the ExternalSecret sync calls failed over the last 5 minutes.
              Read the operator logs and make sure that the provider is reachable and the credentials are valid.
          expr: |
            sum(rate(externalsecret_sync_calls_error[5m]))
              /
            sum(rate(externalsecret_sync_calls_total[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
            app: external-secrets
        - alert: ExternalSecretSyncErrorRatioCritical
          annotations:
            summary: More than 50 percent of ExternalSecret sync calls fail
            description: |
              More than 50 percent of the ExternalSecret sync calls failed over the last 5 minutes.
              Secret values in the cluster are stale. Read the operator logs.
          expr: |
            sum(rate(externalsecret_sync_calls_error[5m]))
              /
            sum(rate(externalsecret_sync_calls_total[5m])) > 0.5
          for: 10m
          labels:
            severity: critical
            app: external-secrets
        - alert: ExternalSecretProviderApiErrorRateHigh
          annotations:
            summary: Provider API errors for {{ $labels.provider }}, call {{ $labels.call }}
            description: |
              More than 20 percent of the `{{ $labels.call }}` calls to the provider `{{ $labels.provider }}` return an error.
              Read the provider status page, the access permissions and the rate limits.
          expr: |
            sum by (provider, call) (rate(externalsecret_provider_api_calls_count{status!="success"}[5m]))
              /
            sum by (provider, call) (rate(externalsecret_provider_api_calls_count[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
            app: external-secrets
        - alert: ExternalSecretNoSyncActivity
          annotations:
            summary: No ExternalSecret sync activity in the last 3 hours
            description: |
              The operator did not run one single ExternalSecret sync in the last 3 hours, but ExternalSecret objects exist.
              The controller is stuck, it restarts in a loop, or it stopped the reconciliation.
          expr: |
            (sum(rate(externalsecret_sync_calls_total[3h])) == 0)
              and
            (sum(externalsecret_status_condition{condition="Ready"}) > 0)
          for: 1h
          labels:
            severity: critical
            app: external-secrets
    - name: external-secrets-controller
      rules:
        - alert: ExternalSecretsControllerReconcileErrors
          annotations:
            summary: Controller {{ $labels.controller }} reports reconciliation errors
            description: |
              The controller `{{ $labels.controller }}` of the External Secrets Operator returns errors for more than 15 minutes.
              Read the operator logs.
          expr: |
            sum by (controller) (rate(controller_runtime_reconcile_errors_total{service=~".*external-secrets.*"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
            app: external-secrets
        - alert: ExternalSecretsControllerQueueGrowing
          annotations:
            summary: Work queue of controller {{ $labels.name }} grows
            description: |
              The work queue of the controller `{{ $labels.name }}` holds more than 50 items for 15 minutes.
              The operator cannot follow the load. Raise the concurrency, or reduce the refresh rate.
          expr: |
            sum by (name) (workqueue_depth{service=~".*external-secrets.*"}) > 50
          for: 15m
          labels:
            severity: warning
            app: external-secrets
        - alert: ExternalSecretsWebhookErrors
          annotations:
            summary: The External Secrets webhook returns errors
            description: |
              The admission webhook of the External Secrets Operator returns HTTP 5xx answers.
              New ExternalSecret and SecretStore objects can be refused. Read the webhook pod logs.
          expr: |
            sum(rate(controller_runtime_webhook_requests_total{service=~".*external-secrets.*", code=~"5.."}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            app: external-secrets
