---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets-cert-controller-metrics
spec:
  namespaceSelector:
    matchNames:
      - external-secrets
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: true
