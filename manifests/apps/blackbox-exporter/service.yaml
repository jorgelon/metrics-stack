apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
spec:
  ports:
    - name: https
      port: 9115
      targetPort: https
    - name: probe
      port: 19115
      targetPort: http
  selector:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: apps-monitoring
    app.kubernetes.io/version: { { .Values.blackboxExporter.release } }
