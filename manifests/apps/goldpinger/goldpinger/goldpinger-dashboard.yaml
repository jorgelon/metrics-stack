{{- if .Values.goldpinger.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: goldpinger-dashboard-{{ .Values.name }}
  labels:
    {{- include "commonLabels" . | nindent 4 }}
    {{- include "selector" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-{{ .Values.name }}"
  configMapRef:
    name: goldpinger-dashboard-{{ .Values.name }}
    key: goldpinger-dashboard.json
  folder: goldpinger
{{- end }}