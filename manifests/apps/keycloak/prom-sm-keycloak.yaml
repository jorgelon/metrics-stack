apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keycloak
  namespace: monitoring
spec:
  endpoints:
    - path: /metrics
      port: management
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
  jobLabel: app
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
