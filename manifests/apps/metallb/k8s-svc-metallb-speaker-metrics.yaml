apiVersion: v1
kind: Service
metadata:
  name: metallb-speaker-monitor-service
  namespace: metallb-system
  labels:
    name: metallb-speaker-monitor-service
spec:
  type: ClusterIP
  clusterIP: None
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/component: speaker
  ports:
    - name: metricshttps
      port: 9120
      targetPort: metricshttps
    # Only backed by an endpoint when the speaker runs in FRR mode
    # (speaker.frr.enabled=true), which adds the frrmetricshttps container port.
    - name: frrmetricshttps
      port: 9121
      targetPort: frrmetricshttps
