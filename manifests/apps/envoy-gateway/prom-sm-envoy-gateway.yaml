apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: eg
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      # Pinned so PrometheusRule expressions can select job="envoy-gateway"
      # instead of the scraped Service name.
      relabelings:
        - action: replace
          targetLabel: job
          replacement: envoy-gateway
